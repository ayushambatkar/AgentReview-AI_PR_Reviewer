services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
  redis-server:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    
  worker:
    build: .
    command: python worker.py
    env_file:
      - .env
    depends_on:
      - redis
    
  